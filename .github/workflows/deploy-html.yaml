name: Publish Notes to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout vault repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site with Quartz
        run: |
          git clone --depth 1 https://github.com/jackyzha0/quartz.git /tmp/quartz
          cd /tmp/quartz
          npm ci

          rm -rf content/*
          cp -r "${{ github.workspace }}/thinking/"* content/

          if [ ! -f content/index.md ] && [ -f "${{ github.workspace }}/README.md" ]; then
            cp "${{ github.workspace }}/README.md" content/index.md
          fi

          # 自动定位 Quartz 5 配置文件并替换站点根路径
          grep -rl --exclude-dir=node_modules --exclude-dir=.git "quartz.jzhao.xyz" . | xargs -r sed -i 's|quartz.jzhao.xyz|harodggg.github.io/thinking|g'

          # 自动定位样式文件并隐藏左上角 "Quartz 5" 与首页 "index" 大标题
          TARGET_SCSS=$(find . -maxdepth 4 \( -name "custom.scss" -o -name "base.scss" \) -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$TARGET_SCSS" ]; then
            printf '\n.page-title, body[data-slug="index"] .article-title { display: none !important; }\n' >> "$TARGET_SCSS"
          fi

          npx quartz build

          # 为 GitHub Pages 下的中文/特殊符号无后缀链接自动补全 .html 跳转
          node -e 'const fs=require("fs");if(fs.existsSync("public/404.html")){let h=fs.readFileSync("public/404.html","utf8");h=h.replace("<head>",`<head><script>if(!location.pathname.endsWith(".html")&&!location.pathname.endsWith("/")){location.replace(location.pathname+".html"+location.search+location.hash);}</script>`);fs.writeFileSync("public/404.html",h);}'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/quartz/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
